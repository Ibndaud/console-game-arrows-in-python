name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    name: Линтинг (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить uv
        uses: astral-sh/setup-uv@v5

      - name: Проверить код ruff
        run: uvx ruff check .

  smoke:
    name: Smoke-тесты (запуск модулей)
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      # На раннере нет системного Python 3.13, а проект требует >=3.13:
      # ставим его сами, иначе uv sync не найдёт интерпретатор.
      - name: Установить Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Установить uv
        uses: astral-sh/setup-uv@v5

      - name: Установить зависимости из uv.lock
        run: uv sync

      - name: Проверить синтаксис всех файлов
        run: uv run python -m compileall . legacy

      - name: Импортировать игровые модули (headless)
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          uv run python -c "import sys; sys.path.insert(0, '.'); import direction, field, ui"
          uv run python -c "import sys; sys.path.insert(0, '.'); import game"

  tests:
    name: Тесты (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Установить uv
        uses: astral-sh/setup-uv@v5

      - name: Установить зависимости из uv.lock
        run: uv sync

      - name: Запустить тесты
        env:
          SDL_VIDEODRIVER: dummy
        run: uv run pytest -q

